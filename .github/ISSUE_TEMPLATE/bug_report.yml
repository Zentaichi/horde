name: Bug report
description: Report a problem with Horde
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Before filing, please check
        [existing issues](https://github.com/Zentaichi/horde/issues) for duplicates.
  - type: input
    id: version
    attributes:
      label: Horde version
      description: Version shown on the installer, or from `package.json` if running from source.
      placeholder: e.g. 0.5.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install PHP 8.4.23
        2. Create a MySQL instance
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant output from the app log (`electron-log`), the DevTools console, or the terminal.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, recordings, or anything else that helps reproduce the issue.
