name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: horde-installer
          path: |
            release/Horde Setup *.exe
            release/Horde Setup *.exe.blockmap

  release:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: horde-installer
      - name: Extract changelog section for this version
        run: node .github/scripts/release-notes.mjs
      - run: dir
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Horde Setup *.exe
            Horde Setup *.exe.blockmap
          body_path: notes.md
