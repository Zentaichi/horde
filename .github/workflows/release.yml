name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: horde-installer
          path: |
            release/Horde Setup *.exe
            release/Horde Setup *.exe.blockmap

  release:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: horde-installer
      - run: dir
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Horde Setup *.exe
            Horde Setup *.exe.blockmap
          generate_release_notes: true
